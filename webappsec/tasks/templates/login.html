<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .error {
            background: #fdecea;
            color: #b91c1c;
            padding: 10px;
            border-left: 4px solid #dc2626;
            margin-bottom: 15px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #2b6cb0;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1e4f8a;
        }

        .register {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Login</h2>

    {% if form.errors %}
        <div class="error">
            Please enter a correct username and password.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="id_username">Username</label>
        {{ form.username }}

        <label for="id_password">Password</label>
        {{ form.password }}

        <button type="submit">Login</button>
    </form>

    <div class="register">
        Don’t have an account?
        <a href="/register/">Register here</a>
    </div>
</div>

</body>
</html>
