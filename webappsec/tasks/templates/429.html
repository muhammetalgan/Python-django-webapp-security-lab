<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Too Many Requests</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .container {
            width: 420px;
            margin: 100px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #b91c1c;
            margin-bottom: 15px;
        }

        p {
            font-size: 15px;
            color: #444;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #2b6cb0;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
        }

        a:hover {
            background: #1e4f8a;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Too Many Requests</h2>
    <p>You have made too many login attempts.</p>
    <p>Please wait a minute and try again.</p>

    <a href="/login/">Back to login</a>
</div>
</body>
</html>
